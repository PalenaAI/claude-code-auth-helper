name: release

# Cut a GitHub Release with cross-compiled binaries whenever a v-prefixed tag is
# pushed, e.g.  git tag v0.1.0 && git push origin v0.1.0
# Run it manually with a tag to (re)build Homebrew bottles and republish the
# formula for an existing release without cutting a new one.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild Homebrew bottles for (e.g. v0.1.2)
        required: true
        type: string

permissions:
  contents: read    # least privilege by default; jobs elevate as needed

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'       # build releases with the latest patched Go
          check-latest: true
          cache: true

      - name: Verify (vet + tests)
        run: |
          go vet ./...
          go test ./...

      - name: Build release artifacts
        run: make package VERSION="${GITHUB_REF_NAME}"

      - name: Extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v tag="## [$ver]" '
            index($0, tag) == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { flag = 0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "Extracted notes:"; cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md $prerelease
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes $prerelease
          fi

  # Build a Homebrew bottle per platform and attach it to the release. With a
  # bottle, `brew install` pours a prebuilt binary and skips its build-from-source
  # checks, which fail when the user's Command Line Tools don't match their macOS.
  # Homebrew pours a bottle built on an older macOS on newer ones, so the macOS 15
  # bottle covers macOS 15, 26 and 27. There is no Intel macOS bottle: Homebrew
  # moved macOS x86_64 to Tier 3 in September 2026 and refuses to build the Go
  # dependency there (Intel Macs can use the ccauth-darwin-amd64 release binary).
  bottles:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15          # arm64_sequoia (Apple silicon)
          - ubuntu-24.04      # x86_64_linux
          - ubuntu-24.04-arm  # arm64_linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write   # upload the bottle to the release
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main (2026-10-09)

      - name: Build and test the bottle
        run: |
          set -euo pipefail
          # Build inside a local tap named like the real one, so the bottle
          # records palenaai/tap as its origin.
          tap="$(brew --repository)/Library/Taps/palenaai/homebrew-tap"
          mkdir -p "$tap/Formula"
          packaging/homebrew/render-formula.sh "$TAG" "$tap/Formula/ccauth.rb"
          git -C "$tap" init -q
          git -C "$tap" add -A
          git -C "$tap" -c user.name=ci -c user.email=ci@localhost commit -qm "ccauth $TAG"

          brew install --build-bottle palenaai/tap/ccauth
          brew test palenaai/tap/ccauth
          ccauth --version

          mkdir bottle && cd bottle
          brew bottle --json --no-rebuild \
            --root-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            palenaai/tap/ccauth
          # brew writes "ccauth--<ver>.<tag>.bottle.tar.gz" locally but downloads
          # "ccauth-<ver>.<tag>.bottle.tar.gz"; upload it under the download name.
          for j in *.json; do
            jq -r '.[].bottle.tags[] | "\(.local_filename)\t\(.filename)"' "$j" |
              while IFS=$'\t' read -r local remote; do mv "$local" "$remote"; done
          done
          ls -l

      - name: Attach the bottle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" bottle/*.bottle.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottle-${{ matrix.runner }}
          path: bottle/*.json
          retention-days: 5

  # Render the formula with whichever bottles were built and push it to
  # PalenaAI/homebrew-tap. Platforms without a bottle fall back to a source build.
  # No-ops until the HOMEBREW_TAP_TOKEN secret (a fine-grained PAT with
  # contents:write on the tap repo only) is configured.
  homebrew:
    needs: [release, bottles]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # reads this repo only; the tap write uses HOMEBREW_TAP_TOKEN
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bottle-*
          path: bottles
          merge-multiple: true
      - name: Render formula and publish to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap update."; exit 0
          fi
          shopt -s nullglob
          jsons=(bottles/*.json)
          echo "Bottles: ${#jsons[@]}"
          if [ "${#jsons[@]}" -lt 3 ]; then
            echo "::warning::only ${#jsons[@]} of 3 bottles were built; the others fall back to a source build"
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/PalenaAI/homebrew-tap.git" tap
          mkdir -p tap/Formula
          packaging/homebrew/render-formula.sh "$TAG" tap/Formula/ccauth.rb "${jsons[@]}"
          cat tap/Formula/ccauth.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ccauth.rb
          git diff --cached --quiet || git commit -m "ccauth ${TAG#v}"
          git push
